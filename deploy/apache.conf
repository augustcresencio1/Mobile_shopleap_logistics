<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    Timeout 90
    KeepAlive On
    KeepAliveTimeout 3
    ErrorLog /proc/self/fd/2
    # Never include query strings, request bodies or authorization headers.
    LogFormat "%h %t \"%m %U %H\" %>s %b" shopleap
    CustomLog /proc/self/fd/1 shopleap
</VirtualHost>
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 3
    MaxConnectionsPerChild 300
</IfModule>
