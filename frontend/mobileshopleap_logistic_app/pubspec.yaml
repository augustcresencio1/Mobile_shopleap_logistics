name: mobileshopleap_logistic_app
description: "Shopleap Courier/Rider app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  http: ^1.6.0
  image_picker: ^1.0.7
  image: 4.12.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  path_provider: ^2.1.5
  http_parser: ^4.1.2
  intl: ^0.20.2
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  supabase_flutter: ^2.18.3
  android_intent_plus: ^6.1.0
  webview_flutter: ^4.14.1

dev_dependencies:
  image_picker_platform_interface: ^2.11.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/instrument_sans/OFL.txt

  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrument_sans/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/instrument_sans/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/instrument_sans/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/instrument_sans/InstrumentSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/instrument_sans/InstrumentSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/instrument_sans/InstrumentSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/instrument_sans/InstrumentSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/instrument_sans/InstrumentSans-BoldItalic.ttf
          weight: 700
          style: italic
